<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Famora</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8f6f1;
        color: #1c241f;
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e4e1d8;
        border-radius: 24px;
        padding: 28px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.5;
        color: #556159;
      }
      button {
        background: #2f6b4e;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 10px 18px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are currently offline</h1>
      <p>
        Famora will automatically sync your pending task and shopping list updates as soon as your connection returns.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
