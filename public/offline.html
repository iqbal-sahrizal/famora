<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#315C49" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161917" />
    <title>Offline · Famora</title>
    <style>
      :root {
        --bg: #f7f5ef;
        --card: #ffffff;
        --border: #e4e1d8;
        --text: #1c241f;
        --muted: #556159;
        --accent: #315c49;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161917;
          --card: #1f2421;
          --border: #2f3732;
          --text: #f2f4f2;
          --muted: #a6b0aa;
          --accent: #4c8c6f;
          --accent-fg: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 120px;
        padding: 10px 18px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: var(--accent);
        color: var(--accent-fg);
        border: none;
      }
      a {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are currently offline</h1>
      <p>
        No internet connection was detected. Reconnect to load your family workspace or sign in again.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try Again</button>
        <a href="/login">Sign In</a>
      </div>
    </div>
  </body>
</html>
