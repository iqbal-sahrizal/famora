<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Famora</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f5ef;
        color: #1c241f;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        background: #ffffff;
        border: 1px solid #e4e1d8;
        border-radius: 24px;
        padding: 24px;
      }
      h1 { margin: 0 0 8px; font-size: 20px; color: #315c49; }
      p { margin: 0 0 16px; font-size: 14px; color: #556159; }
      button {
        min-height: 44px;
        padding: 10px 20px;
        border: none;
        border-radius: 14px;
        background: #315c49;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Famora</h1>
      <p>Unable to reach Famora workspace. Check your internet connection and try again.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
